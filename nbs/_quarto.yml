project:
  type: website

execute:
  freeze: auto  # re-execute notebooks only when their source changes

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    keep-md: true
    fig-format: retina
  commonmark: default

website:
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
  sidebar:
    style: floating
    logo: logo.png
    logo-alt: "br41n-ecog-hand-pose home"
    logo-href: index.html

metadata-files: [nbdev.yml, sidebar.yml]